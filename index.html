<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Data Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Country Explorer</h1>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search a city, e.g. Lagos">
    <button id="searchBtn">Search</button>
  </div>

  <!-- The 4 UI states. JavaScript shows only ONE of these at a time. -->
  <div id="loading" class="message" hidden>Loading...</div>
  <div id="error" class="message error" hidden></div>
  <div id="empty" class="message" hidden>No results found. Check the spelling or try another city.</div>
  <div id="results" class="results"></div>

  <script src="script.js"></script>
</body>
</html>
